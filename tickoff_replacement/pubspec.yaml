name: tickoff_replacement
description: Offline Android habit tracker modelled on the supplied TickOff screenshots.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

# Stage 4 will add: flutter_local_notifications + timezone, image_picker,
# record, share_plus.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  path: ^1.9.0
  sqflite: ^2.3.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
